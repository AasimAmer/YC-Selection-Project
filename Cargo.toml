[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tree-sitter = "0.25"
tree-sitter-javascript = "0.23"
tree-sitter-typescript = "0.23"
clap = { version = "4.5", features = ["derive"] }
ratatui = "0.29"
crossterm = "0.28"
rusqlite = { version = "0.32", features = ["bundled"] }
ignore = "0.4"
notify = "8"
faultline-contract = { path = "crates/faultline-contract" }
faultline-parser = { path = "crates/faultline-parser" }
faultline-core = { path = "crates/faultline-core" }
faultline-index = { path = "crates/faultline-index" }
faultline-engine = { path = "crates/faultline-engine" }
faultline-testkit = { path = "crates/faultline-testkit" }
faultline-cli = { path = "crates/faultline-cli" }
faultline-tui = { path = "crates/faultline-tui" }
faultline-eval = { path = "crates/faultline-eval" }
schemars = "1"
