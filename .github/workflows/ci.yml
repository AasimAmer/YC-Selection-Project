name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  rust-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --locked --workspace
  contract-fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90.0
      - run: cargo test --locked -p faultline-testkit --test contract
      - name: Verify response schemas
        run: |
          cargo run --locked -q -p faultline-contract --example schema > "$RUNNER_TEMP/schema.json"
          diff -u fixtures/bootstrap/schemas.json "$RUNNER_TEMP/schema.json"
